services:
  postgis:
    image: postgis/postgis:16-3.7
    platform: linux/amd64
    environment:
      POSTGRES_USER: oge
      POSTGRES_PASSWORD: oge_dev_password
      POSTGRES_DB: oge_rice
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oge -d oge_rice"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - oge_postgis_data:/var/lib/postgresql/data

volumes:
  oge_postgis_data:
