[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oge-main"
version = "0.1.0"
description = "Training and deployment pipeline for OGE Wuhan-1 cropland and rice segmentation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "rasterio>=1.3,<2",
  "requests>=2.32,<3",
  "tifffile>=2025.5,<2027",
  "imagecodecs>=2025.3,<2027",
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
  "transformers>=4.45,<6",
  "segmentation-models-pytorch>=0.5,<1",
  "albumentations>=1.4,<3",
  "scikit-learn>=1.4,<2",
  "tqdm>=4.66,<5",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
export = [
  "onnx>=1.16,<2",
  "onnxruntime>=1.18,<2",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
oge-api = "oge_main.api.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

