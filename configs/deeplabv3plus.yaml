experiment:
  name: deeplabv3plus_oge_farm
  seed: 42

data:
  dataset_root: null
  split_file: data/splits/oge_farm_v2.json
  statistics_file: data/statistics/oge_farm_v2.json
  image_size: 512
  num_classes: 1
  invalid_pixel_rule: all_bands_zero

model:
  architecture: deeplabv3plus
  encoder: resnet50
  encoder_weights: imagenet
  classes: 1

training:
  epochs: 60
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 4
  early_stopping_patience: 10

output:
  directory: outputs/deeplabv3plus_oge_farm

